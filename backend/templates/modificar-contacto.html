<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/style.css">
    <title>Modificar Contacto</title>
</head>
<body><h2 class="newsTitle">Modificar Contacto</h2>
    < id="modificarContactoForm" class="formmodif">
        <div class="row">
            <div class="columna-25">
                <input type="hidden" id="contactoId" name="id">
                <label for="nombre">Nombre:</label>
            </div>
            <div class="columna-75">
                <input type="text" id="nombre" name="nombre" required>
            </div>
        </div>
        <div class="row">
            <div class="columna-25">
                <label for="apellido">Apellido:</label>
            </div>
            <div class="columna-75">
                <input type="text" id="apellido" name="apellido" required>
            </div>
        </div>
        <div class="row">
            <div class="columna-25">
                <label for="email">Email:</label>
            </div>
            <div class="columna-75">
                <input type="email" id="email" name="email" required>
            </div>
        </div>
        <div class="row">
            <div class="columna-25">
                <label for="genero">Género:</label>
            </div>
            <div class="columna-75">
                <select id="genero" name="genero" required>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Femenino">No binario</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="columna-25">
                <label for="pais">País:</label>
            </div>
            <div class="columna-75">
                <select id="pais" name="pais" onchange="alternarEntradaPais(this)">
                    <option value="default">Seleccione un pais</option>
                    <option value="argentina">Argentina</option>
                    <option value="bolivia">Bolivia</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                    <option value="colombia">Colombia</option>
                    <option value="ecuador">Ecuador</option>
                    <option value="españa">España</option>
                    <option value="italia">Italia</option>
                    <option value="francia">Francia</option>
                    <option value="uruguay">Uruguay</option>
                    <option value="usa">USA</option>
                    <option value="otro">Otro</option>
                </select>
                <input type="text" id="otroPais" name="otroPais" placeholder="Ingrese el país" style="display: none;">
            </div>
        </div>
        <div class="row">
            <div class="columna-25">
                <i class="fa fa-comments-o" aria-hidden="true"></i>
                <label for="comentario">Comentario:</label>
            </div>
            <div class="columna-75">
                <textarea id="comentario" name="comentario"></textarea>
                <br>
            </div>
        </div>
        <button type="submit">Guardar Cambios</button>
    </form>
    <script src="../static/js/modificar-contacto.js"></script>
</body>
</html>
